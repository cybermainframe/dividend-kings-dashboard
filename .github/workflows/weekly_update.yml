- name: Guardar alterações no GitHub
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "github-actions[bot]@users.noreply.github.com"
    
    git add data/*.csv
    
    if git diff --staged --quiet; then
      echo "Não há alterações novas nos dados."
    else
      git commit -m "Atualização automática de dados das Dividend Kings"
      git push
    fi
