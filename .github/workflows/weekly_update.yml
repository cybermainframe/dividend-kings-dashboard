name: Atualização Semanal dos Dados

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar script de atualização
        run: python update_data.py

      - name: Guardar alterações no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --staged --quiet; then
            echo "Não há alterações novas nos dados."
          else
            git commit -m "Atualização automática de dados das Dividend Kings"
            git push
          fi
